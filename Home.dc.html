/* WORK_PROGRESS: per-case progress line. Large screens: on the logo + name row, right-aligned. Small screens (≤760px): under the panels,
   with the logo + name, the panel in focus and the line all centred. Set .pbar-top,.pbar-bot{display:none!important} to hide it again */
.pbar-top{flex:0 0 min(360px,100%);margin-left:auto}
.pbar-bot{display:none}
@media (max-width:760px){
  .pbar-top{display:none}
  .pbar-bot{display:flex;justify-content:center;position:relative;z-index:3;margin-top:-4px}
  .pbar-bot .bar{flex:0 0 min(240px,56vw)}
  .phead,.pheadin{justify-content:center!important}
  /* CASE_HEAD_STACK: smaller screens - client logo above the title, no divider, everything centred */
  .phead .pheadin{flex-direction:column;gap:12px!important;text-align:center}
  .pheadin>span[aria-hidden]{display:none}
  .pheadin .ptitle{text-align:center;max-width:100%}

  .phead .pheadin .ptitle{translate:0 clamp(10px,2vw,14px)} /* sits a little lower: more air under the logo, less gap to the panels (logo and panels don't move) */ /* title has its own row now, so it no longer needs shrinking to fit beside the logo */
  .track{scroll-padding-left:0;padding-left:11vw;padding-right:11vw}
  .track .panel{scroll-snap-align:center}
}
@media (max-width:600px){.track{padding-left:8vw;padding-right:8vw}}

/* HDR_CENTER_LANDING (landing only, all sizes): logo / toggle / About+Work each centred on their own row; the floating bar is unchanged.
   Offsets are measured in hdrCenter() and applied with the 'translate' property so they stack on top of the existing landing transforms */
.hcenter .hdr.hc-on{padding-bottom:calc(clamp(40px, 6vw, 88px) - clamp(40px, 6vw, 64px) + var(--cPad, 0px))!important}
.hcenter .hdr.hc-on:not(.hdr-on) .logowrap{translate:var(--cLx,0px) 0px}

.hcenter .hdr .logowrap,.hcenter .hdr .navrow{transition:transform .6s cubic-bezier(.22,1,.36,1),translate .6s cubic-bezier(.22,1,.36,1)}
.hcenter .hdr .modetog.mini{transition:transform .6s cubic-bezier(.22,1,.36,1),translate .6s cubic-bezier(.22,1,.36,1),color .6s,background .6s,border-color .6s,box-shadow .6s}
.hcenter .hdr-measure .logowrap,.hcenter .hdr-measure .navrow,.hcenter .hdr-measure .modetog.mini{transition:none!important}

/* CASE_ARROWS (larger screens): small prev / next buttons laid over the peeking next panel of each case.

.pnav{display:none}
@media (min-width:761px){
  .pnav{display:block;position:relative;height:0;z-index:6;pointer-events:none}
  .pnavin{position:absolute;left:calc(var(--gut) + 760px * var(--pk, 1) + 28px);right:0;top:calc(-28px - 250px * var(--pk, 1));transform:translateY(-50%);display:flex;justify-content:center;gap:12px}
  .pbtn{width:52px;height:52px;pointer-events:auto}
  .pbtn.isdis{opacity:.38;cursor:default}
  .pbtn.isdis:hover{transform:none}
}

/* CASE_ARROWS_ROW (all screens wider than 760px): the arrows sit on the title row in place of the progress line; the peek overlay is off.
   Phones (≤760px) keep the centred layout with the progress line under the panels */
.pnav-top{display:none}
@media (min-width:761px){
  .pbar-top{display:none!important}
  .pnav{display:none!important}
  .pnav-top{display:flex;gap:10px;margin-left:auto;flex:none}
  .pnav-top .pbtn{width:52px;height:52px} /* full-size arrows (were 40px) */
}

/* THEME_SWAP_INSTANT: no transitions during the one-frame Lava/Cake swap */
.tswap *,.tswap *::before,.tswap *::after{transition:none!important}

        trackRef: (el) => { this.tracks = this.tracks || {}; this.tracks[x.id] = el; if (el && !el.__swipe) { el.__swipe = 1; let sx = 0, sy = 0, on = false; el.addEventListener('touchstart', (e) => { if (!document.documentElement.classList.contains('rows-paged')) return; const t = e.touches[0]; sx = t.clientX; sy = t.clientY; on = true; }, { passive: true }); el.addEventListener('touchend', (e) => { if (!on) return; on = false; const t = e.changedTouches[0]; const dx = t.clientX - sx, dy = t.clientY - sy; if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.2) this.step(x.id, dx < 0 ? 1 : -1); }, { passive: true }); } },
        secRef: (el) => { this.secs = this.secs || {}; if (el && this.io && this.secs[x.id] !== el) this.io.observe(el); this.secs[x.id] = el; },
        prev: () => this.step(x.id, -1),
        next: () => this.step(x.id, 1),
        onScroll: (e) => {
          const el = e.currentTarget;
          cancelAnimationFrame(this.raf);
          this.raf = requestAnimationFrame(() => {
            const max = el.scrollWidth - el.clientWidth;
            const v = max > 0 ? el.scrollLeft / max : 0;
            const cur = ((this.state || {}).prog || {});
            if (Math.abs((cur[x.id] || 0) - v) > 0.01) this.setState({ prog: { ...cur, [x.id]: v } });
          });
        }
      }))
    };
  }
}
</script>
